<title id="title">Figure 10 — Demand-side closure through verified workflow output</title><desc id="desc">A circular industrial loop from physical infrastructure to system delivery, workflow economics, verified output, adoption and cash flow, utilization, and capital reinvestment.</desc>
<rect width="1600" height="720" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:40px;font-weight:700}.s{font-size:22px;fill:#444}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.b{font-size:22px;font-weight:700}.n{font-size:18px;fill:#555}.a{stroke:#333;stroke-width:3;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="70" y="68" class="t">Infrastructure demand closes only when compute becomes verified economic output</text>
<text x="70" y="108" class="s">The long-run test is not GPU shipments or token volume alone, but whether repeated workflows validate utilization, revenue, and capital recovery.</text>
<g transform="translate(70 225)">
<rect class="box" x="0" y="0" width="190" height="115" rx="15"/><text class="b" x="95" y="48" text-anchor="middle">Physical</text><text class="b" x="95" y="78" text-anchor="middle">infrastructure</text>
<rect class="box" x="220" y="0" width="190" height="115" rx="15"/><text class="b" x="315" y="48" text-anchor="middle">System</text><text class="b" x="315" y="78" text-anchor="middle">delivery</text>
<rect class="box" x="440" y="0" width="190" height="115" rx="15"/><text class="b" x="535" y="48" text-anchor="middle">Workflow</text><text class="b" x="535" y="78" text-anchor="middle">economics</text>
<rect class="box" x="660" y="0" width="190" height="115" rx="15"/><text class="b" x="755" y="48" text-anchor="middle">Verified</text><text class="b" x="755" y="78" text-anchor="middle">output</text>
<rect class="box" x="880" y="0" width="190" height="115" rx="15"/><text class="b" x="975" y="48" text-anchor="middle">Adoption /</text><text class="b" x="975" y="78" text-anchor="middle">cash flow</text>
<rect class="box" x="1100" y="0" width="190" height="115" rx="15"/><text class="b" x="1195" y="63" text-anchor="middle">Utilization</text>
<rect class="box" x="1320" y="0" width="190" height="115" rx="15"/><text class="b" x="1415" y="48" text-anchor="middle">Capital</text><text class="b" x="1415" y="78" text-anchor="middle">reinvestment</text>
<line class="a" x1="190" y1="58" x2="215" y2="58"/><line class="a" x1="410" y1="58" x2="435" y2="58"/><line class="a" x1="630" y1="58" x2="655" y2="58"/><line class="a" x1="850" y1="58" x2="875" y2="58"/><line class="a" x1="1070" y1="58" x2="1095" y2="58"/><line class="a" x1="1290" y1="58" x2="1315" y2="58"/>
</g>
<path d="M1485 365 C1485 540 200 570 165 355" fill="none" class="a"/>
<text x="800" y="500" class="s" text-anchor="middle">Core economic question: cost per verified workflow outcome + capital required to sustain it</text>
<line x1="70" y1="570" x2="1530" y2="570" stroke="#bbb"/>
<text x="70" y="612" class="n">Source: Report framework; Chapters 14, 19, 24, and 32.</text>
<text x="70" y="644" class="n">Boundary: “verified workflow output” is a long-run economic criterion, not an empirically calibrated fact metric as of the August 28, 2026 evidence cutoff.</text>
