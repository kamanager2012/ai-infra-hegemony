<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111}.t{font-size:40px;font-weight:700}.s{font-size:23px;fill:#444}.lab{font-size:23px;font-weight:700}.v{font-size:31px;font-weight:700}.n{font-size:18px;fill:#555}.bar{fill:#444}.axis{stroke:#222;stroke-width:2}.tick{font-size:18px;fill:#555}</style>
<text x="75" y="68" class="t">2026 年 forward resource reservation 明显增强</text>
<text x="75" y="108" class="s">NVIDIA forward supply / capacity commitment family（US$B）</text>
<line x1="165" y1="650" x2="1370" y2="650" class="axis"/>
<line x1="165" y1="170" x2="165" y2="650" class="axis"/>
<text x="135" y="655" class="tick" text-anchor="end">0</text><text x="135" y="495" class="tick" text-anchor="end">100</text><text x="135" y="335" class="tick" text-anchor="end">200</text><text x="135" y="175" class="tick" text-anchor="end">300</text>
<line x1="155" y1="490" x2="1370" y2="490" stroke="#ddd"/><line x1="155" y1="330" x2="1370" y2="330" stroke="#ddd"/><line x1="155" y1="170" x2="1370" y2="170" stroke="#ddd"/>
<rect class="bar" x="290" y="498" width="240" height="152"/><text class="v" x="410" y="475" text-anchor="middle">95.2</text><text class="lab" x="410" y="690" text-anchor="middle">2026-01-25</text>
<rect class="bar" x="640" y="460" width="240" height="190"/><text class="v" x="760" y="437" text-anchor="middle">119</text><text class="lab" x="760" y="690" text-anchor="middle">2026-04-26</text>
