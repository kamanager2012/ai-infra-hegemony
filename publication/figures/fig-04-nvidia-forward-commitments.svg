<title id="title">图 4 — NVIDIA 2026 年 forward supply / capacity commitment family</title><desc id="desc">三根柱表示三个公开 forward-commitment 时点：2026-01-25 的 95.2B 美元、2026-04-26 的 119B 美元、2026-07-26 的 279B 美元；各时点的 disclosure label、mix 与 duration 并不完全相同。</desc>
