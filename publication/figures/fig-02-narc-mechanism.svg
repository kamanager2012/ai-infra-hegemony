<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">图 2 — Non-AI Residual Capacity</title><desc id="desc">Effective Supply 扣除 AI Server Absorption 与 Other Priority Demand 后，剩余给非 AI 终端的 residual capacity。</desc>
<rect width="1600" height="720" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:24px;fill:#444}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.b{font-size:28px;font-weight:700}.n{font-size:19px;fill:#555}.eq{font-size:32px;font-weight:700}.a{stroke:#333;stroke-width:4;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#333"/></marker></defs>
<text x="80" y="72" class="t">Non-AI Residual Capacity（NARC）</text>
<text x="80" y="116" class="s">总产能增长，并不保证低优先级终端获得更多 qualified、affordable supply。</text>
<rect class="box" x="110" y="220" width="350" height="150" rx="18"/><text class="b" x="285" y="285" text-anchor="middle">Effective Supply</text><text class="n" x="285" y="325" text-anchor="middle">qualified + usable + deliverable</text>
<rect class="box" x="625" y="170" width="350" height="120" rx="18"/><text class="b" x="800" y="225" text-anchor="middle">AI Server Absorption</text><text class="n" x="800" y="258" text-anchor="middle">AI / HPC priority demand</text>
<rect class="box" x="625" y="330" width="350" height="120" rx="18"/><text class="b" x="800" y="385" text-anchor="middle">Other Priority Demand</text><text class="n" x="800" y="418" text-anchor="middle">其他更高优先级 allocation</text>
<rect class="box" x="1140" y="220" width="350" height="150" rx="18"/><text class="b" x="1315" y="278" text-anchor="middle">Non-AI Residual</text><text class="b" x="1315" y="314" text-anchor="middle">Capacity</text><text class="n" x="1315" y="346" text-anchor="middle">传统终端可获得的 residual access</text>
<line class="a" x1="460" y1="295" x2="585" y2="235"/><line class="a" x1="460" y1="295" x2="585" y2="390"/><line class="a" x1="1015" y1="230" x2="1120" y2="280"/><line class="a" x1="1015" y1="390" x2="1120" y2="320"/>
<text x="800" y="520" class="eq" text-anchor="middle">NonAI_Residual = Effective_Supply − AI_Server_Absorption − Other_Priority_Demand</text>
<line x1="80" y1="582" x2="1520" y2="582" stroke="#bbb"/>
<text x="80" y="625" class="n">Source：本报告定义；主要见第 3、8、21、32 章。</text>
<text x="80" y="658" class="n">Boundary：必须使用 layer-specific physical denominator；wafer、HBM bits、package starts 与 energized MW 不得合并成一个总量。</text>
</svg>