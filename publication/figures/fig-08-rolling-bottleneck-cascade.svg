<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">图 8 — Rolling Bottleneck Cascade</title><desc id="desc">七阶段示意图，展示 binding constraint 如何从 HBM / packaging 迁移到 hardware delivery、supply expansion、site arrival、power / interconnection、deployment / utilization 与 next-cycle commitments。</desc>
<rect width="1600" height="700" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:23px;fill:#444}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.b{font-size:22px;font-weight:700}.n{font-size:18px;fill:#555}.a{stroke:#333;stroke-width:3;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="70" y="70" class="t">Rolling Bottleneck Cascade</text>
<text x="70" y="112" class="s">AI infrastructure 没有永久 bottleneck；相邻层扩张或收紧时，binding constraint 会迁移。</text>
<g transform="translate(55 225)">
<rect class="box" x="0" y="0" width="190" height="120" rx="15"/><text class="b" x="95" y="48" text-anchor="middle">HBM / packaging</text><text class="b" x="95" y="78" text-anchor="middle">tight</text>
<rect class="box" x="215" y="0" width="190" height="120" rx="15"/><text class="b" x="310" y="48" text-anchor="middle">Hardware delivery</text><text class="b" x="310" y="78" text-anchor="middle">受限</text>
<rect class="box" x="430" y="0" width="190" height="120" rx="15"/><text class="b" x="525" y="48" text-anchor="middle">Manufacturing</text><text class="b" x="525" y="78" text-anchor="middle">supply expands</text>
<rect class="box" x="645" y="0" width="190" height="120" rx="15"/><text class="b" x="740" y="48" text-anchor="middle">更多 systems</text><text class="b" x="740" y="78" text-anchor="middle">到达 site</text>
<rect class="box" x="860" y="0" width="190" height="120" rx="15"/><text class="b" x="955" y="48" text-anchor="middle">Power / grid</text><text class="b" x="955" y="78" text-anchor="middle">成为瓶颈</text>
<rect class="box" x="1075" y="0" width="190" height="120" rx="15"/><text class="b" x="1170" y="48" text-anchor="middle">Deployment /</text><text class="b" x="1170" y="78" text-anchor="middle">utilization 放缓</text>
<rect class="box" x="1290" y="0" width="200" height="120" rx="15"/><text class="b" x="1390" y="48" text-anchor="middle">Next-cycle</text><text class="b" x="1390" y="78" text-anchor="middle">commitments 调整</text>
<line class="a" x1="190" y1="60" x2="210" y2="60"/><line class="a" x1="405" y1="60" x2="425" y2="60"/><line class="a" x1="620" y1="60" x2="640" y2="60"/><line class="a" x1="835" y1="60" x2="855" y2="60"/><line class="a" x1="1050" y1="60" x2="1070" y2="60"/><line class="a" x1="1265" y1="60" x2="1285" y2="60"/>
</g>
<text x="800" y="445" class="s" text-anchor="middle">该链条也可能反向：过度建设的 power 或 manufacturing capacity 会把问题从 scarcity 推向 low utilization 与弱回报。</text>
<line x1="70" y1="535" x2="1530" y2="535" stroke="#bbb"/>
<text x="70" y="580" class="n">Source：本报告 framework；第 6–8、19、24、30 章。</text>
<text x="70" y="612" class="n">Boundary：这是 causal schematic，不是确定性 sequence、timing forecast，也不表示每一轮都从 HBM / packaging 开始。</text>
</svg>