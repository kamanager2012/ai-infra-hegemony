<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">图 6 — S1 到 S4 scenario map</title><desc id="desc">四个 parallel conditional states 的定性分析图，S2 标记为 2026 年 8 月 evidence baseline。</desc>
<rect width="1500" height="900" fill="white"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#111}.t{font-size:40px;font-weight:700}.s{font-size:22px;fill:#444}.q{font-size:26px;font-weight:700}.d{font-size:19px;fill:#444}.axis{stroke:#222;stroke-width:3}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.current{fill:none;stroke:#111;stroke-width:6}.n{font-size:18px;fill:#555}</style>
<text x="75" y="68" class="t">S1–S4 是 parallel conditional states，不是确定性的阶段序列</text>
<text x="75" y="108" class="s">这是定性 discriminator map：supply / substitution 与 demand / capital validation 共同决定 scenario weight。</text>
<line x1="235" y1="690" x2="1325" y2="690" class="axis"/><line x1="235" y1="690" x2="235" y2="205" class="axis"/>
<text x="780" y="755" class="s" text-anchor="middle">Supply elasticity / substitution / portability →</text>
<text x="75" y="445" class="s" text-anchor="middle" transform="rotate(-90 75 445)">Demand quality / utilization / capital validation →</text>
<rect class="box" x="310" y="250" width="430" height="180" rx="18"/><text class="q" x="525" y="300" text-anchor="middle">S3 — Resource Hegemony</text><text class="d" x="525" y="340" text-anchor="middle">multi-layer scarcity + switching costs</text><text class="d" x="525" y="370" text-anchor="middle">+ forward reservation 强化 concentration</text>
<rect class="box" x="820" y="250" width="430" height="180" rx="18"/><text class="q" x="1035" y="300" text-anchor="middle">S1 — Competitive Expansion</text><text class="d" x="1035" y="340" text-anchor="middle">supply elasticity 与 alternative stacks</text><text class="d" x="1035" y="370" text-anchor="middle">降低 scarcity premium 与 concentration</text>
<rect class="box" x="310" y="470" width="430" height="180" rx="18"/><text class="q" x="525" y="520" text-anchor="middle">S4 — Capital Hard Landing</text><text class="d" x="525" y="560" text-anchor="middle">utilization / monetization / financing quality</text><text class="d" x="525" y="590" text-anchor="middle">无法验证持续扩张的 capital base</text>
<rect class="box current" x="820" y="470" width="430" height="180" rx="18"/><text class="q" x="1035" y="520" text-anchor="middle">S2 — Baseline Concentration</text><text class="d" x="1035" y="560" text-anchor="middle">high growth + concentration coexist</text><text class="d" x="1035" y="590" text-anchor="middle">同时存在可信但不完整的 substitution</text><text class="d" x="1035" y="622" text-anchor="middle">Current evidence baseline · 2026-08</text>
<line x1="75" y1="805" x2="1425" y2="805" stroke="#bbb"/>
<text x="75" y="842" class="n">Source：本报告 S1–S4 framework；第 30 章。</text>
<text x="75" y="872" class="n">Boundary：坐标只是 interpretive discriminator，不是 calibrated score；scenario 没有固定 probability，图中位置不代表唯一必要条件。</text>
</svg>