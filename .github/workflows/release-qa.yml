name: Release QA v1

on:
  push:
    branches: [main]
    paths:
      - "publication/**"
      - "en/publication/**"
      - "scripts/**"
      - "dist/publication.zh.md"
      - "dist/publication.en.md"
      - "data/critical-external-links.json"
      - "data/third-party-materials.json"
      - ".github/workflows/release-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    name: Bilingual release QA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-dejavu-core \
            poppler-utils \
            qpdf \
            unzip

      - name: Run one-command release QA
        run: bash scripts/run-release-qa.sh

      - name: Upload bilingual publication and proof
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-release-qa
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/ai-infrastructure-hegemony.zh.pdf
            dist/ai-infrastructure-hegemony.en.pdf
            dist/ai-infrastructure-hegemony.zh.epub
            dist/ai-infrastructure-hegemony.en.epub
            dist/publication.zh.md
            dist/publication.en.md
            dist/proof/**
            dist/zh-pdf.log
            dist/en-pdf.log
