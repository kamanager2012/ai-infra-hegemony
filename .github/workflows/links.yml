name: links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  relative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative markdown links
        run: python scripts/check-links.py
