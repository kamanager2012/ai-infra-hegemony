name: links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  relative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check release QA scripts
        run: |
          python -m py_compile             scripts/check-links.py             scripts/check-required-sources.py             scripts/check-research-numeric-claims.py             scripts/check-publication-numeric-claims.py             scripts/check-publication-rights.py             scripts/check-publication-editorial.py             scripts/check-materialized-publication.py             scripts/build_publication.py             scripts/proof_publication.py             scripts/recompute_models.py
          bash -n scripts/run-release-qa.sh

      - name: Check relative markdown links
        run: python scripts/check-links.py

      - name: Check required evidence sources
        run: python scripts/check-required-sources.py

      - name: Check research every-number source coverage
        run: python scripts/check-research-numeric-claims.py

      - name: Check publication numeric source coverage
        run: python scripts/check-publication-numeric-claims.py

      - name: Check publication third-party asset rights
        run: python scripts/check-publication-rights.py

      - name: Check publication editorial hygiene
        run: python scripts/check-publication-editorial.py

      - name: Recompute versioned D-grade models
        run: python scripts/recompute_models.py

      - name: Check materialized bilingual publication sources
        run: python scripts/check-materialized-publication.py
