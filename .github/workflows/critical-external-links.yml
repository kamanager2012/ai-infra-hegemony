name: critical-external-links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - "data/critical-external-links.json"
      - "scripts/check-external-links.py"
      - ".github/workflows/critical-external-links.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check critical evidence URLs and redirect destinations
        run: python scripts/check-external-links.py
