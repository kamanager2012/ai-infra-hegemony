<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="820" viewBox="0 0 1550 820" role="img" aria-labelledby="title desc">
<title id="title">Figure 9 — Anchor demand and Financing Reflexivity</title><desc id="desc">A financing flow linking anchor workload demand, third-party capital, seller equity or credit support, infrastructure assets, utilization and monetization, and capital recovery.</desc>
<rect width="1550" height="820" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:40px;font-weight:700}.s{font-size:22px;fill:#444}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.b{font-size:23px;font-weight:700}.n{font-size:18px;fill:#555}.a{stroke:#333;stroke-width:3;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="70" y="68" class="t">Anchor demand can accelerate capital formation — and increase financing reflexivity</text>
<text x="70" y="108" class="s">Demand visibility, independent capital, and seller support should be separated before judging financing quality.</text>
<rect class="box" x="90" y="235" width="300" height="125" rx="16"/><text class="b" x="240" y="285" text-anchor="middle">Anchor workload demand</text><text class="n" x="240" y="320" text-anchor="middle">long-duration compute commitments</text>
<rect class="box" x="90" y="430" width="300" height="125" rx="16"/><text class="b" x="240" y="480" text-anchor="middle">Third-party capital</text><text class="n" x="240" y="515" text-anchor="middle">independently priced risk capital</text>
<rect class="box" x="465" y="335" width="300" height="125" rx="16"/><text class="b" x="615" y="385" text-anchor="middle">Seller support</text><text class="n" x="615" y="420" text-anchor="middle">equity / credit / LPS coordination</text>
<rect class="box" x="840" y="335" width="300" height="125" rx="16"/><text class="b" x="990" y="385" text-anchor="middle">LPS / compute assets</text><text class="n" x="990" y="420" text-anchor="middle">land + power + shell + systems</text>
<rect class="box" x="1215" y="235" width="280" height="125" rx="16"/><text class="b" x="1355" y="285" text-anchor="middle">Utilization / monetization</text><text class="n" x="1355" y="320" text-anchor="middle">workload cash generation</text>
<rect class="box" x="1215" y="430" width="280" height="125" rx="16"/><text class="b" x="1355" y="480" text-anchor="middle">Capital recovery</text><text class="n" x="1355" y="515" text-anchor="middle">cash yield / refinancing / residual value</text>
<line class="a" x1="390" y1="297" x2="825" y2="370"/><line class="a" x1="390" y1="492" x2="825" y2="425"/><line class="a" x1="765" y1="397" x2="835" y2="397"/><line class="a" x1="1140" y1="375" x2="1205" y2="315"/><line class="a" x1="1355" y1="360" x2="1355" y2="420"/>
<path d="M1215 492 C1020 670 520 670 330 565" fill="none" class="a"/>
<text x="775" y="665" class="s" text-anchor="middle">Healthy loop: real utilization validates capital. Stress loop: seller support rises while utilization and independent risk appetite weaken.</text>
<text x="775" y="710" class="n" text-anchor="middle">First-party risk anchors: NVIDIA PORTS-Pike max US$105B conditional guarantee exposure; AMD max US$4.1B gross lease-guarantee exposure.</text>
<line x1="70" y1="715" x2="1480" y2="715" stroke="#bbb"/>
<text x="70" y="752" class="n">Source: Report framework, Chapters 13, 23, and 24; risk anchors from NVIDIA FY27 Q2 and AMD Q2 2026 Forms 10-Q.</text>
<text x="70" y="782" class="n">Boundary: guarantee exposures are maximum risk amounts, not funded CapEx or additive demand totals; financing quality depends on utilization, monetization, independent risk capital, and refinancing conditions.</text>
</svg>