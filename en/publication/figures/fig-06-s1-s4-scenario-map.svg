<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Figure 6 — S1 to S4 scenario map</title><desc id="desc">Four parallel scenario states arranged on a two-axis analytical map, with S2 marked as the current evidence baseline as of August 2026.</desc>
<rect width="1500" height="900" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.t{font-size:40px;font-weight:700}.s{font-size:22px;fill:#444}.q{font-size:26px;font-weight:700}.d{font-size:19px;fill:#444}.axis{stroke:#222;stroke-width:3}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.current{fill:none;stroke:#111;stroke-width:6}.n{font-size:18px;fill:#555}</style>
<text x="75" y="68" class="t">S1–S4 are parallel conditional states, not a deterministic sequence</text>
<text x="75" y="108" class="s">A compact analytical map: supply/substitution pressure and demand/capital validation jointly discriminate the state.</text>
<line x1="235" y1="690" x2="1325" y2="690" class="axis"/><line x1="235" y1="690" x2="235" y2="205" class="axis"/>
<text x="780" y="755" class="s" text-anchor="middle">Supply elasticity / substitution / portability →</text>
<text x="75" y="445" class="s" text-anchor="middle" transform="rotate(-90 75 445)">Demand quality / utilization / capital validation →</text>
<rect class="box" x="310" y="250" width="430" height="180" rx="18"/><text class="q" x="525" y="300" text-anchor="middle">S3 — Resource Hegemony</text><text class="d" x="525" y="340" text-anchor="middle">scarcity + quantity assurance / delivery access</text><text class="d" x="525" y="370" text-anchor="middle">+ switching costs + financing coordination</text><text class="d" x="525" y="400" text-anchor="middle">strengthen while monetization supports commitments</text>
<rect class="box" x="820" y="250" width="430" height="180" rx="18"/><text class="q" x="1035" y="300" text-anchor="middle">S1 — Competitive Expansion</text><text class="d" x="1035" y="340" text-anchor="middle">supply elasticity and alternative stacks</text><text class="d" x="1035" y="370" text-anchor="middle">reduce scarcity premiums and concentration</text>
<rect class="box" x="310" y="470" width="430" height="180" rx="18"/><text class="q" x="525" y="520" text-anchor="middle">S4 — Capital Hard Landing</text><text class="d" x="525" y="560" text-anchor="middle">utilization / monetization / financing quality</text><text class="d" x="525" y="590" text-anchor="middle">fail to validate the expanding capital base</text>
<rect class="box current" x="820" y="470" width="430" height="180" rx="18"/><text class="q" x="1035" y="520" text-anchor="middle">S2 — Baseline Concentration</text><text class="d" x="1035" y="560" text-anchor="middle">high growth + concentration coexist</text><text class="d" x="1035" y="590" text-anchor="middle">while credible substitution paths expand</text><text class="d" x="1035" y="622" text-anchor="middle">Current evidence baseline · Aug 2026</text>
<line x1="75" y1="805" x2="1425" y2="805" stroke="#bbb"/>
<text x="75" y="842" class="n">Source: Report S1–S4 framework, Chapter 30.</text>
<text x="75" y="872" class="n">Boundary: axes are interpretive discriminators, not calibrated scores; scenarios carry no fixed probabilities. Placement is schematic and does not imply that any scenario requires a unique combination of axis values.</text>
</svg>